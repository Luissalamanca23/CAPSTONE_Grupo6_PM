name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: GymKeep
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: GymKeep/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  vision:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: GymKeep/vision
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: GymKeep/vision/requirements.txt
      - name: Instala torch (CPU) y las dependencias de vision
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: GymKeep/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instala dependencias
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npm run build
