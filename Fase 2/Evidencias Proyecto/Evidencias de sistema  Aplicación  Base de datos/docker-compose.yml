version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: gymkeep_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gymkeep}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gymkeep_password}
      POSTGRES_DB: ${POSTGRES_DB:-gymkeep}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: gymkeep_api
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-gymkeep}:${POSTGRES_PASSWORD:-gymkeep_password}@db:5432/${POSTGRES_DB:-gymkeep}
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
    command: sh -c "python -m app.init_db && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  db_data:
