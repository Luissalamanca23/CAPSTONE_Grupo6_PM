server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;

    # Solo /api/ llega a la API (no se publican /docs ni /health). El nombre se resuelve en cada
    # peticion para que nginx arranque aunque la API todavia no este lista.
    resolver 127.0.0.11 valid=10s;
    location /api/ {
        set $api http://api:8000;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # Rutas de la web (/reportar/<token>, /equipos...): siempre index.html.
    location / {
        try_files $uri /index.html;
    }
}
