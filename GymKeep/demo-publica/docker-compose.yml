# Demo publica de GymKeep: base de datos, API y la web servida por nginx en UN solo puerto
# local (8088). Ese puerto es el que publica `tailscale funnel`. No incluye el modulo de vision.
# Lo levanta iniciar-demo.ps1; a mano: docker compose -f demo-publica/docker-compose.yml up -d --build
name: gymkeep-demo

include:
  - ../docker-compose.yml

services:
  frontend:
    build:
      context: ../frontend
      dockerfile: ../demo-publica/Dockerfile.frontend
      args:
        VITE_API_URL: /api/v1
    container_name: gymkeep_web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:${DEMO_PORT:-8088}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
