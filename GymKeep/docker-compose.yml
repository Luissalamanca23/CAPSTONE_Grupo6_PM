services:
  db:
    image: postgres:16-alpine
    container_name: gymkeep_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gymkeep}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gymkeep_password}
      POSTGRES_DB: ${POSTGRES_DB:-gymkeep}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      # El esquema completo (empresas/sucursales/zonas/equipos/QR/camaras/IA/incidencias/
      # mantenimientos/sesiones de uso/auditoria) y los datos de ejemplo se cargan solos la
      # primera vez que se crea el volumen db_data. Ver GymKeep_BDD_Completa/README.md.
      - ./postgres/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./postgres/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gymkeep} -d ${POSTGRES_DB:-gymkeep}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    container_name: gymkeep_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-gymkeep}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-gymkeep_mongo_password}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
      # Colecciones eventos_ia / detecciones_raw (TTL 7 dias) / telemetria_camaras (TTL 30 dias).
      - ./mongo/init-mongo.js:/docker-entrypoint-initdb.d/01-init-mongo.js:ro
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--username",
          "${MONGO_ROOT_USER:-gymkeep}",
          "--password",
          "${MONGO_ROOT_PASSWORD:-gymkeep_mongo_password}",
          "--authenticationDatabase",
          "admin",
          "--eval",
          "db.adminCommand('ping')",
        ]
      interval: 10s
      timeout: 10s
      retries: 10

  minio:
    # Docker Hub dejo de servir minio/minio y minio/mc (setiembre 2026); se usa el
    # espejo oficial en quay.io en su lugar.
    image: quay.io/minio/minio:latest
    container_name: gymkeep_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-gymkeep}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-gymkeep_minio_password}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data

  # Crea el bucket de evidencias (snapshots/clips de camara) automaticamente al levantar.
  minio-init:
    image: quay.io/minio/mc:latest
    container_name: gymkeep_minio_init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-gymkeep} ${MINIO_ROOT_PASSWORD:-gymkeep_minio_password};
      mc mb --ignore-existing local/${S3_BUCKET:-gymkeep-evidencias};
      exit 0;
      "

  api:
    build: .
    container_name: gymkeep_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mongo:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-gymkeep}:${POSTGRES_PASSWORD:-gymkeep_password}@db:5432/${POSTGRES_DB:-gymkeep}
      MONGO_URL: mongodb://${MONGO_ROOT_USER:-gymkeep}:${MONGO_ROOT_PASSWORD:-gymkeep_mongo_password}@mongo:27017/?authSource=admin
      MONGO_DB: ${MONGO_DB:-gymkeep_ai}
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-gymkeep}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-gymkeep_minio_password}
      S3_BUCKET: ${S3_BUCKET:-gymkeep-evidencias}
      S3_REGION: ${S3_REGION:-us-east-1}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
    # El esquema ya lo crea Postgres con schema.sql (arriba), por eso ya no se ejecuta
    # app.init_db aqui: solo levanta la API.
    command: sh -c "uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  db_data:
  mongo_data:
  minio_data:
